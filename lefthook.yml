# Multi-line job logic lives in .lefthook/scripts/ rather than inline here.
# On Windows, lefthook passes inline `run` scripts to sh without escaping
# double quotes, which breaks any script containing them.
pre-commit:
  parallel: true
  jobs:
    - name: biome check
      glob: "*.{js,jsx,ts,tsx,cjs,cts,mjs,mts,json,jsonc}"
      run: bunx biome check --write --files-ignore-unknown=true --no-errors-on-unmatched {staged_files}
      stage_fixed: true

    - name: check-yaml
      glob: "*.{yml,yaml}"
      run: sh .lefthook/scripts/check-yaml.sh {staged_files}

    - name: check-json
      glob: "*.{json,jsonc}"
      run: sh .lefthook/scripts/check-json.sh {staged_files}

    - name: end-of-file-fixer
      glob: "*"
      run: sh .lefthook/scripts/end-of-file-fixer.sh {staged_files}
      stage_fixed: true

    - name: trailing-whitespace
      glob: "*"
      run: sh .lefthook/scripts/trailing-whitespace.sh {staged_files}
      stage_fixed: true

    - name: check-added-large-files
      run: sh .lefthook/scripts/check-added-large-files.sh {staged_files}

    - name: check-merge-conflict
      run: sh .lefthook/scripts/check-merge-conflict.sh {staged_files}

    - name: no-commit-to-branch
      run: sh .lefthook/scripts/no-commit-to-branch.sh

    - name: build
      run: bun run build
